<body>
<header><p class="muted">Scorecard · Round report</p><h1 id="course">Round report</h1><p id="details" class="muted"></p><div id="phone-date"></div></header>
<nav id="downloads"></nav>

<main id="report"><p class="error">Scan a round QR code to open its report.</p></main>
<script id="report-code">

  "Title": "Round report",
  "Course": "Course",
  "Player": "Player",
  "Slot": "Player slot",
  "Date": "Date",
  "Tee": "Tee",
  "Status": "Status",
  "Archived": "Archived",
  "InProgress": "In progress",
  "Detail": "Hole detail",
  "SummaryOnly": "Summary only: hole detail unavailable",
  "Unavailable": "Unavailable",
  "Yes": "Yes",
  "No": "No",
  "Recovered": "Recovered record",
  "Score": "Gross strokes",
  "Par": "Played par",
  "ToPar": "To par",
  "Putts": "Putts",

  "Short": "Short game excluding putts",
  "Penalty": "Penalty strokes",

  "Holes": "Holes scheduled",
  "OnePutts": "One-putt holes",

  "Back": "Back 9 gross",
  "Hole": "Hole",
  "Entered": "Entered (1=yes, 0=no)",
  "Yards": "Yards",
  "Si": "Stroke index",
  "Events": "Penalty events",

  "DownloadCsv": "Download table (.csv)",
  "DownloadJson": "Download data (.json)",
  "DownloadHtml": "Save formatted report (.html)",
  "DownloadHelp": "Open this page in Safari to download. Find the file in Files > Browse > Downloads (iCloud Drive or On My iPhone, depending on your settings).",

  "Blue": "Blue",
  "White": "White",
  "Fairway": "Fairway hit (1=yes, 0=no)",
  "Gir": "Green in regulation (1=yes, 0=no)",
  "FairwaysHit": "Fairways hit",
  "FairwayHoles": "Fairway holes (par 4/5 entered)",

  }

  }
  function validPhoneDate(value) {

  function toPar(value) { return value>0?'+'+value:value===0?'E':String(value); }

  function worst(r,p) {
    return p.holes.map((h,i)=>({hole:i+1,toPar:gross(h)-r.par[i],valid:entered(h)&&r.par[i]!==0}))
      .filter(h=>h.valid).sort((a,b)=>b.toPar-a.toPar).slice(0,3);
  }
  function metadataFields(r,p) {
    return [[L.Course,r.course],[L.Player,p.name],[L.Slot,p.slot+1],[L.Date,dateLabel(r)],

      [L.Events,r.penaltiesRecorded?L.Yes:L.Unavailable],[L.FairwaysHit,r.fairwaysRecorded?L.Yes:L.Unavailable],[L.Yards,L.Yards]];

      [L.Putts,s.putts],[L.In100,s.in100],[L.Out100,s.out100],[L.Short,s.short],
      [L.Penalty,r.penaltiesRecorded?s.penalties:missing],[L.Hazards,r.penaltiesRecorded?hazards:missing],[L.Obs,r.penaltiesRecorded?obs:missing],
      [L.Thru,s.thru],[L.Holes,r.holeCount],[L.OnePutts,s.onePutts],[L.ThreePutts,s.threePutts],[L.Recovered,+r.repaired],
      [L.FairwaysHit,r.fairwaysRecorded?s.fir:missing],[L.FairwayHoles,r.fairwaysRecorded?s.firAnswered:missing],

      [L.GirHoles,hasPar(r)?s.girEligible:missing],[L.GirPct,hasPar(r)?pct(s.gir,s.girEligible):missing],

  function events(r,h) {return r.penaltiesRecorded?`${L.Hazards}: ${h.hazards}; ${L.Obs}: ${h.obs}`:L.Unavailable;}

  function text(r,p) {

        body.append(row);
      });table.append(body);wrap.append(table);section.append(wrap);
      // Every field from the device HTML remains accessible without horizontal scrolling.
      const detail=node('details');detail.append(node('summary','Hole-by-hole detail'));
      player.holes.forEach((h,i)=>{detail.append(node('h3',ScorecardReport.L.Hole+' '+(i+1)));appendFields(detail,ScorecardReport.holeFields(round,player,i));if(h.bunker)detail.append(node('p','Greenside bunker: Yes'));});
      section.append(detail);report.append(section);
    }
    const downloads=document.getElementById('downloads');
    for(const [label,name,type,content] of [[ScorecardReport.L.DownloadAgent,ScorecardReport.filename(round,'txt'),'text/plain;charset=utf-8',ScorecardReport.agentText(round)],[ScorecardReport.L.DownloadCsv,ScorecardReport.filename(round,'csv'),'text/csv;charset=utf-8',ScorecardReport.csv(round)]]){
      const link=node('a',label);link.download=name;link.href=URL.createObjectURL(new Blob([content],{type}));downloadUrls.push(link.href);downloads.append(link);
    }
    report.append(node('p','Round data stays in this link on your phone. No analytics or uploads.','notes muted'));share.hidden=false;
  }
  share.addEventListener('click',async()=>{
    if(!round)return;const text=ScorecardReport.summary(round);
    try {
      const files=[new File([ScorecardReport.agentText(round)],ScorecardReport.filename(round,'txt'),{type:'text/plain;charset=utf-8'}),new File([ScorecardReport.csv(round)],ScorecardReport.filename(round,'csv'),{type:'text/csv;charset=utf-8'})];
      const shareFiles=navigator.canShare&&(navigator.canShare({files})?files:navigator.canShare({files:[files[0]]})?[files[0]]:null);
      if(navigator.share&&shareFiles){await navigator.share({title:'Round report',text,files:shareFiles});status.textContent='Shared';}
      else {await navigator.clipboard.writeText(text);status.textContent='Summary copied';}
    }catch(error){
      if(error.name!=='AbortError')try{await navigator.clipboard.writeText(text);status.textContent='Summary copied';}
      catch{status.textContent='Sharing unavailable. Select and copy the report text.';}
    }
  });
  window.addEventListener('hashchange',()=>{phoneDate='';render();});render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
}
</script>
</body>
</html>
